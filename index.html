<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>QuickNotes</h1>

        <button id="load-btn" type="button">Load Notes</button>

        <p id="status" aria-live="polite"></p>

        <form id="note-form">
            <div>
                <label for="title-input">Title</label>
                <input
                    type="text"
                    id="title-input"
                    maxlength="100"
                    required
                >
            </div>

            <div>
                <label for="body-input">Body</label>
                <textarea
                    id="body-input"
                    rows="5"
                ></textarea>
            </div>

            <button type="submit" id="submit-btn">Create Note</button>
        </form>

        <h2>Notes</h2>

        <ul id="notes-list"></ul>
    </main>

    <script src="api.js" defer></script>
</body>
</html>
